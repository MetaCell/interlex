server {
    listen 80;

    location / {
        root   /usr/share/nginx/html/;
        try_files $uri /index.html;
    }

    # The neurdf ontology baked in at build time (see Dockerfile). Its own location for two
    # reasons: it needs real caching, and it must 404 when absent rather than fall through to
    # `try_files $uri /index.html` — the loader treats an HTML body as a failure and falls back to
    # upstream, but only if it actually gets one it can recognise, and a 404 is much clearer.
    location /data/ {
        root /usr/share/nginx/html/;
        try_files $uri =404;

        # Content-negotiated upstream serves this as text/plain; label it correctly here.
        types { }
        default_type application/ld+json;

        # The file only changes when the image is rebuilt (or the optional start-up refresh runs),
        # so let the browser keep it. This is the whole point of baking it in. `expires` already
        # emits Cache-Control: max-age, so adding one here too would duplicate the header.
        expires 7d;

        # The .gz is written next to the file at build time, so nginx ships the pre-compressed
        # bytes and never spends CPU deflating 16MB per request. `gzip on` is the safety net for
        # when the .gz is absent (e.g. after the optional start-up refresh on an older image).
        gzip_static on;
        gzip on;
        gzip_types application/ld+json application/json;
        gzip_min_length 1024;
        gzip_comp_level 5;
    }

    # Proxy for Elasticsearch API requests
    location /api/elasticsearch {
        proxy_pass https://api.scicrunch.io/elastic/v1/Interlex_pr/_search;
        proxy_set_header Host api.scicrunch.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type application/json;
        proxy_ssl_verify off;
    }

    location ~ ^/u/ops/.* {
        proxy_pass https://uri.olympiangods.org;
        proxy_set_header Host uri.olympiangods.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        
        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
    }

    # Specific handler for entity-new: converts 303 → 200 + JSON so JS can read the location
    location ~ ^/([^/]+)/priv/entity-new$ {
        proxy_pass https://uri.olympiangods.org;
        proxy_set_header Host uri.olympiangods.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type application/json;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_ssl_verify off;

        proxy_intercept_errors on;
        error_page 303 = @handle_entity_redirect;

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers X-Redirect-Location always;
    }

    location ~ ^/([^/]+)/priv/(.*) {
        proxy_pass https://uri.olympiangods.org;
        proxy_set_header Host uri.olympiangods.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;

        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers X-Redirect-Location always;
    }

    location ~ ^/[^/]+/(tmp|ilx)_.*\.(html|ttl|jsonld|n3|owl|csv)$ {
        proxy_pass https://uri.olympiangods.org;
        proxy_set_header Host uri.olympiangods.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        
        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
    }

    # Handle PATCH/PUT/POST requests to ilx_/tmp_ endpoints
    location ~ ^/[^/]+/(ilx|tmp)_[^/]+$ {
        proxy_pass https://uri.olympiangods.org;
        proxy_set_header Host uri.olympiangods.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type application/json;
        
        # Pass through auth/cookies if present
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        
        proxy_ssl_verify off;
        
        # CORS headers for all methods including preflight
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie, X-Requested-With" always;
        add_header Access-Control-Expose-Headers "X-Redirect-Location" always;
        
        # Handle preflight OPTIONS requests
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location ~ ^/[^/]+/ontologies/uris/.*\.(html|jsonld)$ {
        proxy_pass https://uri.olympiangods.org;
        proxy_set_header Host uri.olympiangods.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
        
        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
    }

    location ~ ^/[^/]+/ontologies/uris/.*/spec$ {
        proxy_pass https://uri.olympiangods.org;
        proxy_set_header Host uri.olympiangods.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_ssl_verify off;
        
        # Handle 303 redirects
        proxy_intercept_errors on;
        error_page 303 = @handle_303;
        
        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers X-Redirect-Location always;
    }

    location ~ ^/[^/]+/[^/]+/versions(/[^/]+)?$ {
        proxy_pass https://uri.olympiangods.org;
        proxy_set_header Host uri.olympiangods.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_ssl_verify off;

        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
    }

    location ~ ^/[^/]+/ontologies$ {
        proxy_pass https://uri.olympiangods.org;
        proxy_set_header Host uri.olympiangods.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_ssl_verify off;

        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
    }

    location ~ ^/[^/]+/curies$ {
        proxy_pass https://uri.olympiangods.org;
        proxy_set_header Host uri.olympiangods.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_ssl_verify off;

        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
    }

    location ~ ^/[^/]+/contributions$ {
        proxy_pass https://uri.olympiangods.org;
        proxy_set_header Host uri.olympiangods.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_ssl_verify off;

        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
    }

    # Convert entity-new 303 → 200 + JSON body with redirect location
    location @handle_entity_redirect {
        internal;
        default_type application/json;
        add_header X-Redirect-Location $upstream_http_location always;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers X-Redirect-Location always;
        return 200 '{"location":"$upstream_http_location"}';
    }

    # Convert spec-endpoint 303 → 200 + JSON body with redirect location
    # (no second proxy_pass here - that resent the original POST to the
    # upstream a second time, which nginx's 303 interception already saw)
    location @handle_303 {
        internal;
        default_type application/json;
        add_header X-Redirect-Location $upstream_http_location always;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers X-Redirect-Location always;
        return 200 '{"location":"$upstream_http_location"}';
    }

    location /static/ {
        autoindex on;
        alias /usr/share/nginx/html/static/;
    }

    # Proxy for transitive query endpoint
    location ~ ^/[^/]+/query/transitive/.* {
        proxy_pass https://uri.olympiangods.org;
        proxy_set_header Host uri.olympiangods.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through auth/cookies if present (mirrors Vite configure hook)
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_ssl_verify off;

        # Helpful CORS for credentialed requests in dev
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers X-Redirect-Location always;

        # (Optional but handy for preflight)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            return 204;
        }
    }

}
