      parameters:
        - name: group
          in: path
          required: true
          description: The group of the ontologies to retrieve
          schema:
            type: string
        - name: term
          in: path
          required: true
          description: The name of term to search for ontologies
          schema:
            type: string
      responses:
        200:
          description: A paged array of ontologies
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontologies'
                example: 
                    [
                      {
                        name : "Test Ontology 1",
                        description : "This file imports all the bridging modules that are relating NIF-Cell with other NIF  modules",
                        id: "nif-neuron-bridge-test1",
                        version_info: "0.1; May 9th, 2012",
                        url : "http://ontology.neuinfo.org/NIF/ttl/unused/NIF-Neuron-Bridge.ttl"
                      },{
                        name : "Test Ontology 2",
                        description : "This file imports all the bridging modules that are relating NIF-Cell with other NIF  modules",
                        id: "nif-neuron-bridge-test2",
                        version_info: "0.1; May 9th, 2012",
                        url : "http://ontology.neuinfo.org/NIF/ttl/unused/NIF-Neuron-Bridge.ttl"
                      }
                    ]
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /{group}/discussions/{term}: 
    get:
      summary: List all discussions for a term
      operationId: get_discussions
      tags:
        - term
      parameters:
        - name: group
          in: path
          required: true
          description: The group of the term to retrieve
          schema:
            type: string
        - name: term
          in: path
          required: true
          description: The id of the term to retrieve
          schema:
            type: string
      responses:
        200:
          description: A paged array of discussions
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discussions'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /{group}/add_discussions/{term}: 
    post:
      summary: Used to save a new discussion.
      operationId: add_to_discussion
      parameters:
        - name: group
          in: path
          required: true
          description: The group of the term to retrieve
          schema:
            type: string
        - name: term
          in: path
          required: true
          description: The id of the term to retrieve
          schema:
            type: string
      requestBody:
        description: The discussion to save.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Discussion'
              x-body-name: discussion
      responses:
        200:
          description: The Discussion data were saved.
          content:
            application/json:
              schema:
                type : object
        400:
          description: Bad Request, bad input parameter for Discusion POST request.
        403:
          description: The request cannot be fullfilled due to the permission of your account.
      tags:
        - API
  /ping:
    get:
      summary: Checks if the server is running
      security: []  
      responses:
        200:
          description: Server is up and running
        default:
          description: Something is wrong
securityDefinitions:
  AuthToken:
    type: apiKey
    name: Authorization
    in: header
definitions:
  Credentials:
    type: object
    required:
      - username
      - password
    properties:
      username:
        type: string
      password:
        type: string
  Registration:
    allOf:
      - $ref: "#/definitions/Credentials"
      - type: object
        required:
          - email
        properties:
          email:
            type: string
          username:
            type: string
          status:
            type: string
  Organization:
    type: object
    properties:
      token:
        description: The authentication token sent from the server after a successful login
        type: string
      name:
        type: string
      status:
        type: string
  Term:
      type: object
      required:
        - "@context"
        - "@graph":
      properties:
        "@context":
          type: object
          additionalProperties: 
            type: string
            format: uri,
            example: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
        "@graph":
          type: array
          items:
            type: array
            items:
              type: object
              additionalProperties: 
                type: string
  LoginToken:
    type: object
    properties:
      token:
        description: The authentication token sent from the server after a successful login
        type: string
      username:
        type: string
      status:
        type: string
  User:
      type: object
      required:
        - name
        - lastName
        - role
        - creationDate
        - email
        - organization
      properties:
        id:
          description: Unique identifier
          type: string
          example: 'JD10101987'
        name:
          description: Name
          type: string
          example: 'oliva'
        lastName:
          description: Last Name
          type: string
          example: 'orhye'
        organization:
          description: organization
          type: string
          example: 'organization'
        orcid:
          description: ORCID ID
          type: string
          example: 'JD10101987'
        active:
          description: active user or not
          type: boolean
          example: true
        role:
