    Fork:
      type: object
      required:
        - name
        - origin
        - destination
        - status
        - date
        - request_url
      properties:
        name:
          type: string
          description : name of the fork
          example : ForkPB08
        origin:
          type: object
          properties :
            name:
              type: string
              description : origin of the fork
              example : ForkPB08
            url:
              type: string
              description : url of the destination
              example : destination.fork.com
        destination:
          type: object
          properties :
            name:
              type: string
              description : name of the destination
              example : Central Nervous System
            url:
              type: string
              description : url of the destination
              example : destination.fork.com
            tag:
              type: string
              description : tag of the fork
              example : Spark Anatomical Work Group
        request_url:
          description: URL of Fork request
          type: string
        date:
          type: string
          format: 'date-time'
          description : date of fork request
          example : 01/01/2005 2024-06-05T18:16:38
        status:
          type: string
          description : Status of Fork e.g. approved, rejected
          enum:
              - requested
              - approved
              - rejected
          example : approved
    Forks:
      type: array
      items:
        $ref: '#/components/schemas/Fork'
