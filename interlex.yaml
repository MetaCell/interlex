openapi: '3.0.0'
info:
  version: 1.0.0
  title: Swagger Mock Missing Endpoints
  license:
    name: MIT
servers:
  - url: http://interlex.swagger.io/v1
paths:
  /operations/login:
    post:
      tags:
        - Auth
      summary: Log in to OpenAPI space
      description: ''
      x-swagger-router-controller: src.server.auth
      operationId: login
      parameters:
        - name: body
          in: body
          description: the user credentials
          schema:
            $ref: "#/definitions/Credentials"
      responses:
        200:
          description: login successful
          schema:
            $ref: "#/definitions/LoginToken"
        401:
          description: invalid password
        404:
          description: user not found
  /operations/logout:
    post:
      tags:
        - Auth
      summary: Log out from OpenAPI space
      description: ''
      x-swagger-router-controller: src.server.auth
      operationId: logout
      responses:
        200:
          description: logout successful
        403:
          description: user was not logged in
      security:
        - AuthToken: []
  /operations/signup:
    post:
      tags:
        - Auth
      summary: Register to OpenAPI space
      description: ''
      x-swagger-router-controller: src.server.auth
      operationId: signup
      requestBody:
        description: The user to register.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
              x-body-name: user
      responses:
        200:
          description: The User data was saved.
          content:
            application/json:
              schema:
                type : object
                properties:
                  status:
                    type: string
                    example: 200
                  user:
                    schema:
                      $ref: "#/definitions/User"
        409:
          description: username or email taken
          schema:
            type: string
            description: defines which field is already in use
            enum:
              - EMAIL
              - USERNAME
  /operations/getUser/{id}:
    get:
      summary: Used to retrieve a specific user.
      operationId: get_user
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the user to retrieve
          schema:
            type: string
      responses:
        200:
          description: The user retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: Bad Request, bad input parameter for User POST request.
        403:
          description: The request cannot be fullfilled due to the permission of your account.
      tags:
        - API
  /operations/getUser/{id}/terms:
    get:
      summary: Used to retrieve a specific user's terms.
      operationId: get_user_terms
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the user to retrieve
          schema:
            type: string
      responses:
        200:
          description: The terms for the user retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terms'
        400:
          description: Bad Request, bad input parameter for User Get request.
        403:
          description: The request cannot be fullfilled due to the permission of your account.
      tags:
        - API
  /operations/getUser/{id}/organizations:
    get:
      summary: Used to retrieve a specific user's organizations.
      operationId: get_user_organizations
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the user to retrieve
          schema:
            type: string
      responses:
        200:
          description: The organizations for the user retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizations'
        400:
          description: Bad Request, bad input parameter for User Get request.
        403:
          description: The request cannot be fullfilled due to the permission of your account.
      tags:
        - API
  /operations/getUser/{id}/forks:
    get:
      summary: Used to retrieve a specific user's forks.
      operationId: get_user_forks
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the user to retrieve
          schema:
            type: string
      responses:
        200:
          description: The forks for the user retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forks'
        400:
          description: Bad Request, bad input parameter for User Get request.
        403:
          description: The request cannot be fullfilled due to the permission of your account.
      tags:
        - API
  /operations/getOrganization/{id}:
    get:
      summary: Used to retrieve a specific organization.
      operationId: get_organization
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the organization to retrieve
          schema:
            type: string
      responses:
        200:
          description: The organization data were saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        400:
          description: Bad Request, bad input parameter for Organization POST request.
        403:
          description: The request cannot be fullfilled due to the permission of your account.
      tags:
        - API
  /operations/newOrganization:
    post:
      summary: Used to save a new organization.
      operationId: new_organization
      requestBody:
        description: The organization to save.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
              x-body-name: organization
      responses:
        200:
          description: The Organization data were saved.
          content:
            application/json:
              schema:
                $ref: "#/definitions/Organization"
        400:
          description: Bad Request, bad input parameter for Organization POST request.
        403:
          description: The request cannot be fullfilled due to the permission of your account.
      tags:
        - API
  /operations/getOrganizations:
    get:
      summary: Get all organizations
      operationId: get_organizations
      tags:
        - API
      responses:
        200:
          description: A paged array of organizations
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organizations'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /operations/getOrganization/{organization}/terms:
    get:
      summary: Get all terms for this organization
      parameters:
        - name: organization
          in: path
          required: true
          description: The id of the organization to retrieve
          schema:
            type: string
      operationId: get_organizations_terms
      tags:
        - API
      responses:
        200:
          description: A paged array of terms for an organization
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terms'
        404:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /operations/getOrganization/{organization}/ontologies:
    get:
      summary: Get all ontologies for this organization
      parameters:
        - name: organization
          in: path
          required: true
          description: The id of the organization to retrieve
          schema:
            type: string
      operationId: get_organizations_ontologies
      tags:
        - API
      responses:
        200:
          description: A paged array of ontologies for an organization
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontologies'
        404:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /operations/getOrganization/{organization}/curies:
    get:
      summary: Get all curies for this organization
      parameters:
        - name: organization
          in: path
          required: true
          description: The id of the organization to retrieve
          schema:
            type: string
      operationId: get_organizations_curies
      tags:
        - API
      responses:
        200:
          description: A paged array of curies for an organization
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curies'
        404:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'              
  /{group}/query/transitive/{property}/{start}?depth:
    get:
      summary: Retrieve hierarchy results
      operationId: get_hierarchy_results
      tags:
        - API
      parameters:
        - name: group
          in: path
          required: true
          description: base group
          schema:
            type: string
        - name: property
          in: path
          required: true
          description: property
          schema:
            type: string
        - name: start
          in: path
          required: true
          description: start
          schema:
            type: string
      responses:
        200:
          description: A paged array of results
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hierarchies'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /{group}/addTerm:
    post:
      summary: Used to add a new term
      operationId: add_term
      tags:
        - Auth
      description: ''
      x-swagger-router-controller: src.server.auth
      parameters:
        - name: group
          in: path
          required: true
          description: The group of the term to retrieve
          schema:
            type: string
      requestBody:
        description: The term to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Term'
              x-body-name: term
      responses:
        200:
          description: A json with new term and status response
          content:
            application/json:
              type: object
              properties:
                status:
                  type: string
                terms:
                  $ref: '#/components/schemas/Term'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /{group}/bulkEditTerms:
    post:
      summary: Used to bulk edit terms
      operationId: bulk_edit_terms
      tags:
        - Auth
      description: ''
      x-swagger-router-controller: src.server.auth
      parameters:
        - name: group
          in: path
          required: true
          description: The group of the term to retrieve
          schema:
            type: string
      requestBody:
        description: The terms to save.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Terms'
              x-body-name: terms
      responses:
        200:
          description: A paged array of terms
          content:
            application/json:
              type: object
              properties:
                status:
                  type: string
                terms:
                  $ref: '#/components/schemas/Terms'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /{group}/match/{term}: 
    get:
      summary: List all matching terms
      operationId: get_match_terms
      tags:
        - term
      parameters:
        - name: group
          in: path
          required: true
          description: group name
          schema:
            type: string
        - name: term
          in: path
          required: true
          description: The id of the term to retrieve
          schema:
            type: string
        - in: query
          name: filters
          schema:
            type: object
            properties:
              attribute:
                type: string
                description: A property to filter results by
                example: attribute1,attribute2,attribute3
              value:
                type: integer
                description: The value for the filter specified above
                example: value1,value2,value3
              condition:
                type: string
                description: Condition for filter attribute
                example: AND, OR, AND
          style: deepObject
          explode: true
      responses:
        200:
          description: A paged array of terms
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Terms"
        404:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /{group}/search/{term}: 
    get:
      summary: List all matching terms, ontologies and organizations
      operationId: search_all
      tags:
        - term
      parameters:
        - name: group
          in: path
          required: true
          description: group name
          schema:
            type: string
        - name: term
          in: path
          required: true
          description: The id of the term to retrieve
          schema:
            type: string
        - in: query
          name: filters
          schema:
            type: object
            properties:
              attribute:
                type: string
                description: A property to filter results by
                example: attribute1,attribute2,attribute3
              value:
                type: integer
                description: The value for the filter specified above
                example: value1,value2,value3
              condition:
                type: string
                description: Condition for filter attribute
                example: AND, OR, AND
          style: deepObject
          explode: true
      responses:
        200:
          description: A paged array of terms
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              type: object
              properties:
                  terms:
                    $ref: "#/components/schemas/Terms"
                  ontologies:
                    $ref: "#/components/schemas/Ontologies"
                  organizations:
                    $ref: "#/components/schemas/Organizations"
        404:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /{group}/curies: 
    get:
      summary: List all curies for group
      operationId: get_curies
      tags:
        - group
      parameters:
        - name: group
          in: path
          required: true
          description: The id of the group to retrieve
          schema:
            type: string
      responses:
        200:
          description: A paged array of terms
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curies'
                example:
                    {
                      rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#",
                      rdfs: "http://www.w3.org/2000/01/rdf-schema#",
                      owl: "http://www.w3.org/2002/07/owl#"
                    }
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /{group}/variants/{term}: 
    get:
      summary: List all variants for a term
      operationId: get_variants
      tags:
        - term
      parameters:
        - name: group
          in: path
          required: true
          description: The group of the term to retrieve
          schema:
            type: string
        - name: term
          in: path
          required: true
          description: The id of the term to retrieve
          schema:
            type: string
      responses:
        200:
          description: A paged array of variants
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variants'
              example:
                  [
                    {
                        "id" : "variant_ilx_0101901",
                        "organization" : "Interlex Lab",  
                        "description" : "The central nervous system is the part of the nervous system...",
                        "timestamp" : "24 March 12:08am",
                        "status" : "Active",
                        "originatingUser" : {
                          "userID" : "olivia",
                          "userName" : "Oliviya Rhye"
                        },
                        "editingUser" : {
                          "userID" : "olivia",
                          "userName" : "Oliviya Rhye"
                        },
                        "url" : "https://uri.olympiangods.org/base/ilx_0101901.jsonld",
                    },
                    {
                      "id" : "variant_ilx_0101431",
                      "organization" : "Interlex Lab 2",  
                      "description" : "The central nervous system is the part of the nervous system...",
                      "timestamp" : "25 March 12:08am",
                      "status" : "Active",
                      "originatingUser" : {
                        "userID" : "olivia",
                        "userName" : "Oliviya Rhye"
                      },
                      "editingUser" : {
                        "userID" : "olivia",
                        "userName" : "Oliviya Rhye"
                      },
                      "url" : "https://uri.olympiangods.org/base/ilx_0101431.jsonld",
                  }
                ]
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /{group}/versions/{term}: 
    get:
      summary: List all versions for a term
      operationId: get_versions
      tags:
        - term
      parameters:
        - name: group
          in: path
          required: true
          description: The group of the term to retrieve
          schema:
            type: string
        - name: term
          in: path
          required: true
          description: The id of the term to retrieve
          schema:
            type: string
      responses:
        200:
          description: A paged array of versions
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Versions'
                example: 
                        [{
                          "id" : "version_ilx_0101901",
                          "fork" : {
                            "name" : "ForkPB-2",
                            "url" : "https://uri.olympiangods.org/base/versions/ilx_0101901"
                          },  
                          "action" : "Merge",
                          "lastModifyBy" : "24 March 12:08am",
                          "author" : "Phoenix Baker",
                        }]
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /{group}/ontologies: 
