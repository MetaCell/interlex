          required: true
          description: The group of the ontologies to retrieve
          schema:
            type: string
      responses:
        200:
          description: A paged array of ontologies
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontologies'
                example: 
                    [
                      {
                        name : "Test Ontology 1",
