version: "1.0"
stages:
  - "clone"
  - "build"
  - "deploy"
  - "e2e_test"

steps:
  clone:
    stage: "clone"
    title: "Cloning interlex"
    type: "git-clone"
    repo: "metacell/interlex"
    revision: "${{CF_BRANCH}}"

  build:
    stage: "build"
    title: "Building interlex"
    type: "build"
    image_name: "interlex"
    tag: "${{CF_SHORT_REVISION}}"
    dockerfile: Dockerfile
    working_directory: ./interlex
    buildkit: true
    registry: "${{CODEFRESH_REGISTRY}}"
    build_arguments:
      - VITE_API_URL=${{VITE_API_URL}}
      - VITE_SCICRUNCH_API_KEY=${{VITE_SCICRUNCH_API_KEY}}

  deploy:
    stage: "deploy"
    title: "Deploying interlex"
    image: codefresh/cf-deploy-kubernetes
    tag: latest
    working_directory: ./interlex/deploy/k8s
    commands:
      - /cf-deploy-kubernetes interlex.yaml
      - /cf-deploy-kubernetes ingress.yaml
    environment:
      - KUBECONTEXT=${{CLUSTER_NAME}}
      - KUBERNETES_NAMESPACE=${{NAMESPACE}}

  e2e_test:
    stage: "e2e_test"
    title: "Running E2E Tests"
    image: node:20
    working_directory: ./interlex/test
    environment:
      - TEST_USERNAME=${{TEST_USERNAME}}
      - TEST_PASSWORD=${{TEST_PASSWORD}}
    commands:
      - npm ci
      - npm test create  && npm test userInfo && npm test searchInfo
