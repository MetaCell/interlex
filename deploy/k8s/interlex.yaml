apiVersion: apps/v1
kind: Deployment
metadata:
  name: interlex
spec:
  selector:
    matchLabels:
      app: interlex
  replicas: 1
  template:
    metadata:
      labels:
        app: interlex
    spec:
      containers:
        - name: interlex
          image: "gcr.io/metacellllc/interlex:{{CF_SHORT_REVISION}}"
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 80
          env:
            - name: ELASTICSEARCH_API_KEY
              value: "tvVqyYwrQqolqVfMo45cu31t5uEGx6RZ"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interlex-backend
spec:
  selector:
    matchLabels:
      app: interlex-backend
  replicas: 1
  template:
    metadata:
      labels:
        app: interlex-backend
    spec:
      containers:
        - name: interlex-backend
          image: "gcr.io/metacellllc/interlex-backend:latest"
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 3001
          env:
            - name: ELASTICSEARCH_API_KEY
              value: "tvVqyYwrQqolqVfMo45cu31t5uEGx6RZ"
---
apiVersion: v1
kind: Service
metadata:
  name: interlex
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: interlex
---
apiVersion: v1
kind: Service
metadata:
  name: interlex-backend
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
  selector:
    app: interlex-backend
