apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-outbound-internet
  namespace: default  # Change if interlex is in another namespace
spec:
  podSelector:
    matchLabels:
      app: interlex  # Ensure this label matches your deployment
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0  # Allow full internet access
  policyTypes:
    - Egress