apiVersion: cert-manager.io/v1
kind: Issuer 
metadata:
  name: 'letsencrypt-interlex'
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: filippo@metacell.us
    privateKeySecretRef:
      name: letsencrypt-interlex
    solvers:
    - http01:
        ingress:
          class: nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /api/1/elastic/Interlex_pr/_search
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/issuer: letsencrypt-interlex
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: 'true'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Authorization $http_authorization;
  name: interlex-nginx-ingress
spec:
  rules:
  - host: "{{DOMAIN}}"
    http:
      paths:
      - path: /api/elasticsearch
        pathType: Prefix
        backend:
          service:
            name: interlex
            port:
              number: 3001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: interlex
            port:
              number: 80
  tls:
  - hosts:
    - "{{DOMAIN}}"
    secretName: interlex-tls
